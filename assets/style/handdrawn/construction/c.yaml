family:
  key: C
  name: "Bio Texture"
  trigger: hdx_biotext
  source_video_role: "reference video 3"
  summary: >-
    Botanical and scientific cut-paper geometry with selective drawing.
    Filled organic shapes, branching structures, stippled surface patterns,
    irregular diagram discs, local-color outlines, and textured
    environmental planes dominate. A close-up human face is a significant
    special case: its large detailed irises and drawn nostrils contradict
    any attempt to impose family A's facial grammar on this family.

evidence_labels:
  measured: >-
    Calculated from specified pixels or file properties (for example a
    patch median hex value). This is an actual property of the chosen
    captured region. It does not prove what value an artist entered in the
    source application.
  observed: >-
    Visible in the inspected images without requiring a hidden production
    history. Observations can have limited scope: a feature observed in one
    close-up should not automatically be assigned to every distant object.
  inferred: >-
    A plausible explanation of the image, such as a vector scene with a
    lightly textured raster overlay. Several different workflows can
    produce similar flattened pixels; an inference must remain
    distinguishable from a fact.
  prescribed: >-
    A concrete reconstruction setting or design rule proposed by the study
    (brush spacing, opacity ranges, proportion guidance, margin targets,
    caption formats). Prescriptions make reproduction testable; they are
    not a claim that original project files were recovered.

toolset_hypothesis:
  status: inferred
  summary: >-
    Hand-shaped filled regions with selective local-color drawing and
    restrained raster surface treatment. Evidence is the diversity of
    organic contours, the deliberate irregularity of diagram discs, and
    directional patterning within plants and biological forms. A close-up
    iris construction adds a concentrated, fine-line subsystem that should
    be preserved as a special close-up mode.
  practical_reconstruction: >-
    Editable filled silhouettes plus a small family of raster mark
    brushes: one for gently irregular contours, one for short fibrous
    marks, and one for sparse material dots. This is an implementation
    hypothesis, not a claim that exactly three brushes were used. The key
    is to separate shape, structural pattern, and incidental texture so
    that each can be controlled independently.
  explicitly_not_established: "no vendor or brush engine identified"

linework:
  measured_edge_samples:
    - anchor: C5
      description: >-
        On source row 1,029, the selected red-line scan gives a 10-pixel
        run under the chosen red-color threshold.
      status: measured
      caveat: >-
        The line is diagonal, so its perpendicular thickness is smaller
        than its horizontal intersection unless the crossing is normal to
        the stroke. This is a directly measured image event, while the
        recommended brush widths below remain calibration starting points,
        not a universal brush width.

  brush_preset:
    structural_mark_width_pct_of_art_width:
      value: "0.12-0.30% of art width, with a wider hierarchy for large forms and fine close-up details"
      status: prescribed
    structural_mark_width_px_at_1920_wide:
      value: "not computed in the study (a pixel equivalent at 1920 wide is given only for family A)"
      status: prescribed
    opacity_and_size_variation:
      value: "0-15% controlled size variation and minimal opacity pressure for veins and structural contours"
      status: prescribed
    spacing:
      value: "1-6% tip spacing for continuous lines; use a separate dispersed-tip brush for dots rather than increasing contour spacing until it breaks"
      status: prescribed
    scatter:
      value: "near 0%; if an edge needs slight irregularity, perturb its path gently at a scale larger than single-pixel noise"
      status: prescribed
    taper:
      value: "short or moderate for leaf veins and fiber endpoints, while keeping diagram connectors sufficiently even to preserve topology"
      status: prescribed
    stabilisation:
      value: "not specified by the study for family C (only family A gives an explicit stabilisation percentage)"
      status: prescribed
    internal_to_outer_ratio:
      value: "do not enforce one external-to-internal ratio across diagrams, plants, faces, and cellular structures; define it within each object class"
      status: prescribed
    additional_rules:
      - "Construct major plants, hills, icons, and biological masses as filled shapes; add an outline only when the relevant object class demonstrates one."
      - "Match line color to the local object role: darker green on leaves, red on the salmon form, dark marks around the close-up eyes."
      - "Let small surface scratches cross broad pale fields sparingly. Keep critical small symbols and connections readable."
      - "Test at final viewing size: a vein that disappears can be widened; a texture that rivals the subject should be reduced."
    calibration_caveat: >-
      These settings are starting recipes. They must be calibrated against
      the anchor at a matched display scale. Software percentage controls
      are not standardized, so numerical agreement between two brush panels
      does not guarantee visual agreement. The acceptance criterion is the
      reproduced edge, not the copied slider value.

  boundary_colour_rule: >-
    The family explicitly supports local-color drawing: red boundaries and
    internal lines around a salmon internal form, related darker marks
    inside vegetation, and black in hair and eye structures on the close-up
    face. These are role-specific decisions; choose the line color by
    object and function, preserving enough contrast for clarity without
    treating black as either compulsory or forbidden. (status: observed)

  internal_drawing_grammar: >-
    The density of internal marks is strongly scale- and subject-dependent.
    Leaf veins and wood growth rings are medium-density structural
    descriptions; diagram icons simplify those structures inside small
    discs; a close-up iris is densely filled with radial lines while the
    surrounding face has only a few accents. The family supports a
    localized high-detail focal region inside an otherwise economical
    image. Patterns are not all stochastic noise: many carry directional
    information about the object they occupy (a tree's grain follows the
    trunk, a cut log's rings follow its cross-section, a leaf's vein
    divides the leaf). (status: observed)

rendering:
  mode: >-
    Mode-dependent. Select the rendering mode first -- botanical
    environment, diagram plate, biological cutaway, or human close-up --
    since each uses a different subset of the family palette and a
    different depth/volume strategy. (status: observed, with a prescribed
    mode-selection rule)

  form_shadow_rule: >-
    A botanical environment conveys depth largely through overlapping
    filled planes, scale, and detail distribution (foreground trunks dark
    and large, distant vegetation lighter or less structurally dense, water
    as a broad intermediate field); there is no need to model every leaf as
    a shaded three-dimensional surface. Scientific callouts intentionally
    depart from environmental realism -- adding physically consistent
    environmental shadows to comparison modules would make them less
    diagrammatic. The close-up face uses large local-color regions with a
    distinct warmer nose plane as a shape-based value and hue distinction,
    not a fully modeled gradient; skin remains largely a broad flat region
    even though eye detail is concentrated. An internal biological form's
    apparent volume is conveyed by taper, internal longitudinal lines, and
    overlap with its surroundings, not by rendering it as a glossy
    translucent specimen. (status: observed)

  cast_shadow_rule: >-
    Grounding is frequently achieved by insertion into a soil band, overlap
    behind vegetation, or a cutaway relationship; a stem entering the
    ground can establish contact without a soft elliptical shadow. Diagram
    discs do not need a floor or cast shadow at all -- their spatial frame
    is informational, not literal physical space. Do not manufacture a
    shadow merely to satisfy a checklist. (status: observed)

  ambient_and_rim_rule: >-
    No consistent ambient-bounce rule is supported across the collection.
    The family's local-color organization does not require reflective
    color bleed. (status: observed)

  colorist_steps:
    - step: 1
      instruction: "Select the rendering mode first: botanical environment, diagram plate, biological cutaway, or human close-up. Each uses a different subset of the family palette."
      status: prescribed
    - step: 2
      instruction: "Block major forms on Normal at full opacity, using local-color differences and overlap to establish structure."
      status: prescribed
    - step: 3
      instruction: "Keep plant veins and internal contours related to the local fill, typically darker or more saturated within the same functional color family."
      status: prescribed
    - step: 4
      instruction: "Use a quiet surface layer as needed, initially around 2-6%, without forcing visible wear into every small icon."
      status: prescribed
    - step: 5
      instruction: "For diagram discs, preserve the cream-on-blue container system and dark-green icon contrast. Avoid drop shadows and bevels unless a new reference supports them."
      status: prescribed
    - step: 6
      instruction: "For biological emphasis, allow orange, salmon, or red focal shapes. Keep these accents purposeful and spatially concentrated."
      status: prescribed
    - step: 7
      instruction: "Use shape-based plane changes on the close-up face rather than continuous airbrush modeling. Retain detailed iris marks without making the skin photographic."
      status: prescribed
    - step: 8
      instruction: "Subordinate environmental texture to silhouettes, pointer tips, and network connections. A correct color treatment must preserve information readability."
      status: prescribed
    - note: >-
        The listed blending modes are reproducible options. The exact
        combination of source color and opacity cannot be uniquely inferred
        from a final pixel because multiple layer stacks can yield the same
        result; a report that states an exact blend percentage without
        access to layers would be presenting a fabrication as a
        measurement.

  forbidden:
    canonical_recipe_exclusions:
      - "universal heavy black outlines around every plant"
      - "photographic leaf shading"
      - "wet glossy surfaces on all biological forms"
      - "metallic bevels around scientific discs"
      - "rainbow-colored network connectors without semantic reason"
      - "strong lens-flare effects"
    scope_note: >-
      These are production exclusions for the canonical recipe, not claims
      that the entire unseen source video could never contain an
      exceptional effect.
    must_not_be_banned: >-
      Pure black, orange, and red are not forbidden -- the close-up face's
      hair is exactly black and its face and nose plane are strongly
      orange, and a mushroom in a comparison-callout scene is visibly
      intense orange; the inspected face and callouts make a universal
      warm-color ban untenable. Likewise, nostril marks and detailed iris
      construction must not be banned: "never draw nostrils" or an
      A-family-style near-omitted nose would be demonstrably wrong for
      this family's close-up mode, and a densely radial-lined iris is a
      defining feature of that mode, not an exception to suppress.

