<!doctype html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>__TITLE__</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:'IBM Plex Sans Arabic';src:url('assets/IBMPlexSansArabic_700Bold.ttf');font-weight:700}
@font-face{font-family:'Tajawal';src:url('assets/Tajawal-Regular.ttf');font-weight:400}
@font-face{font-family:'Tajawal';src:url('assets/Tajawal-Bold.ttf');font-weight:700}
body{margin:0;background:#0d0f12}
#root{position:relative;width:100%;height:100%;overflow:hidden;background:#0d0f12;direction:rtl}
.vw{position:absolute;inset:0;opacity:0;overflow:hidden}
.vid{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
#grain{position:absolute;inset:0;background:url('assets/grain.png');background-size:540px 960px;mix-blend-mode:overlay;opacity:.07;pointer-events:none}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.35) 100%);pointer-events:none}
.cap{position:absolute;left:96px;right:96px;top:1380px;height:220px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0}
.cap span{font-family:'Tajawal',sans-serif;font-weight:700;font-size:58px;line-height:1.35;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 24px rgba(0,0,0,.6);padding:10px 26px 14px;background:rgba(10,12,16,.38);border-radius:22px}
.cap.head span{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:66px;color:#ffe9b0;line-height:1.3}
#end{position:absolute;inset:0;opacity:0;background:#0d0f12}
#end .take{position:absolute;left:100px;right:100px;top:640px;text-align:center;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;font-size:64px;line-height:1.4;color:#fff}
#end .src{position:absolute;left:120px;right:120px;top:1120px;text-align:center;font-family:'Tajawal',sans-serif;font-weight:400;font-size:38px;line-height:1.4;color:#c9c9c9;direction:ltr}
#end .handle{position:absolute;left:0;right:0;top:1400px;text-align:center;font-family:'Tajawal',sans-serif;font-weight:700;font-size:56px;color:#ffe9b0;direction:ltr}
</style>
</head>
<body>
<div id="root" data-composition-id="__COMP_ID__" data-start="0" data-width="1080" data-height="1920" data-duration="__DURATION__" data-fps="30">
__VIDEO_SLOTS__
  <div id="vignette"></div>
  <div id="caps"></div>
  <div id="end"><div class="take">__TAKEAWAY__</div><div class="src">__SOURCE__</div><div class="handle">@kwlegalinsider</div></div>
  <div id="grain"></div>
</div>
<script>
const SHOTS=__SHOTS__;      // [{id,start,duration}]
const CHUNKS=__CHUNKS__;    // [[text,start,end,isHeadline]]
const END_AT=__END_AT__;    // seconds: when the end card fades in
const tl=gsap.timeline({paused:true});
SHOTS.forEach((s,i)=>{
  tl.set('#w'+s.id,{opacity:1},s.start);
  tl.fromTo('#w'+s.id,{scale:1.0},{scale:1.035,duration:s.duration,ease:'none'},s.start);
  if(i>0){tl.fromTo('#w'+s.id,{opacity:0},{opacity:1,duration:.28,ease:'power1.inOut'},s.start);}
});
const capsEl=document.getElementById('caps');
CHUNKS.forEach(([txt,st,en,head],k)=>{const id='cap'+k;
  capsEl.insertAdjacentHTML('beforeend',`<div class="cap${head?' head':''}" id="${id}"><span>${txt}</span></div>`);
  const next=k<CHUNKS.length-1?CHUNKS[k+1][1]:en+0.6;
  const a=st-0.12,b=Math.min(next-0.14,en+0.7);
  tl.fromTo('#'+id,{opacity:0,y:head?26:12},{opacity:1,y:0,duration:head?.4:.2,ease:'power2.out'},a);
  tl.to('#'+id,{opacity:0,duration:.18,ease:'power1.in'},b-.18);
});
tl.to('#end',{opacity:1,duration:.45,ease:'power1.inOut'},END_AT);
tl.fromTo('#end .take',{opacity:0,y:20},{opacity:1,y:0,duration:.5},END_AT+.2);
tl.fromTo('#end .src',{opacity:0},{opacity:1,duration:.4},END_AT+.6);
tl.fromTo('#end .handle',{opacity:0,y:16},{opacity:1,y:0,duration:.4},END_AT+.8);
window.__timelines=window.__timelines||{};
window.__timelines['__COMP_ID__']=tl;
</script>
</body>
</html>
