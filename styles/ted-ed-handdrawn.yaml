# Derived from the three reference videos in assets/references/ted-ed/.
# Colours sampled from assets/references/ted-ed/clean/, motion numbers measured
# by scripts/style_refs/motion_analysis.py (assets/references/ted-ed/motion-profile.json).
# Regenerate the motion half with:
#   python -m scripts.style_refs.motion_analysis assets/references/ted-ed/work/motion-src --fps 24 \
#       --out assets/references/ted-ed/motion-profile.json
identity:
  name: "Hand-drawn Explainer"
  category: whiteboard
  mood: curious, warm, unhurried, a little wry
  pace: moderate
  best_for: "Narrated explainers that teach one idea through drawn metaphors"

visual_language:
  color_palette:
    primary: ["#1A1A1A", "#4A4A4C"]
    accent: ["#C46A3C", "#6F8FA6", "#8D9152", "#9A6F93"]
    background: "#E4DCD8"
    text: "#1A1A1A"
    muted: "#66666A"
  composition: >-
    One idea per frame on open paper. A single subject sits centred or on a third,
    with generous empty space around it; props enter into that space rather than
    crowding the subject. Wide shots by default, close-ups only for a reveal.
  texture: >-
    Flat colour fills with a thin ink outline (about 3 px at 1920 wide, near-black,
    never pure black), over a fixed paper grain. No gradients on objects, no drop
    shadows, no gloss. Backgrounds are a single tinted wash, occasionally a soft
    radial one.

typography:
  headings:
    font: "Source Serif 4"
    weight: 600
    tracking: "0em"
    line_height: 1.25
  body:
    font: "Source Sans 3"
    weight: 400
    line_height: 1.45
  code:
    font: "IBM Plex Mono"
    weight: 400
  stat_card:
    font: "Source Serif 4"
    weight: 700
    size_multiplier: 3.0
  scale_system: "major_third"
  weight_matrix:
    title: 600
    heading: 600
    body: 400
    caption: 400

motion:
  # Measured: shots run about 3.2 s (median), roughly half carry a slow camera
  # move, and cuts outnumber dissolves about 3 to 1.
  transitions: [cut, crossfade, morph, wipe-reveal]
  animation_style: >-
    On twos: everything that moves updates 12 times a second, never smoothly at 24.
    The main drawing holds still; life comes from secondary props - icons popping in
    one after another, bubbles rising out of a head, pieces dissolving away one by
    one - about one event a second. Lines never wobble and the paper never flickers.
  pacing_rules:
    min_scene_hold_seconds: 1.4
    max_scene_hold_seconds: 8
    text_card_hold_seconds: 2.5
    stat_card_hold_seconds: 2.0
    transition_duration_seconds: 1.9
  entrance: "pop from 0 with a small overshoot (back.out), 0.25 s, on twos"
  exit: "shrink to 0 with a fade (power2.in), 0.3 s, staggered across pieces"

audio:
  voice_style: "calm, curious narrator; unhurried; lifts on the question, lands the answer plainly"
  music_mood: "light acoustic or muted piano bed, no drums, stays out of the way"
  music_volume: 0.1
  sfx_style: "sparing - a soft paper rustle on a reveal, nothing on ordinary cuts"
  ducking_threshold_db: -6
  voice_variation_allowed: true
  hero_moment_voice_shift: "slower, half a step lower, small pause before the payoff"

asset_generation:
  image_prompt_prefix: >-
    tededstyle, flat character scene, hand-drawn educational illustration, flat colour
    fills, thin near-black ink outline, muted earthy palette, paper texture background,
    simple faces, generous empty space,
  image_negative_prompt: >-
    photorealistic, 3d render, glossy, drop shadow, gradient shading, neon, lens flare,
    busy background, watermark, text, logo, TED, signature, anime, hyperdetailed
  diagram_style: "hand-inked outlines on paper, rounded corners, labels in Source Sans 3, no fill gradients"
  consistency_anchors:
    - "Paper background #E4DCD8 with a fixed grain in every scene"
    - "Near-black ink #1A1A1A outlines, about 3 px at 1920 wide"
    - "At most 4 fill colours per frame, drawn from the accent list"
    - "One subject per frame, centred or on a third, with empty space around it"
    - "Simple faces: oval or dot eyes, a single-line mouth, no nose detail"
    - "Ideas are shown as physical metaphors, never as labelled boxes"

overlays:
  stat_card:
    bg: "#EFE8E4"
    border: "#1A1A1A"
    radius: 10
  key_term:
    bg: "#E9DCCD"
    text: "#1A1A1A"
    radius: 6
  section_title:
    bg: "#E4DCD8"
    text: "#1A1A1A"
  hero_title:
    bg: "#E4DCD8"
    text: "#1A1A1A"
  stat_reveal:
    bg: "#EFE8E4"
    text: "#9E4F27"
  provider_chip:
    bg: "#EFE8E4"
    text: "#4A4A4C"
    radius: 999
  code_block:
    bg: "#EFE8E4"
    text: "#1A1A1A"
    highlight: "#C46A3C"

quality_rules:
  - "Every held scene carries a secondary prop event about once a second - nothing is ever frozen"
  - "Animated elements step at 12 fps (on twos); smooth 24 fps motion reads as the wrong style"
  - "Lines do not wobble and the paper grain does not flicker - the reference holds both still"
  - "About half of the shots carry a slow camera move: ~39 px/s pan or ~0.2%/s zoom, ease-in-out"
  - "At most 4 fill colours on screen, plus paper and ink"
  - "Text is readable at 720p on a phone; body text never below 32 px at 1920 wide"
  - "No TED or TED-Ed marks, characters or scenes may be reproduced"

chart_palette:
  - "#C46A3C"
  - "#6F8FA6"
  - "#8D9152"
  - "#9A6F93"
  - "#4A4A4C"
  - "#C9A15A"

color_rules:
  harmony_type: "analogous"
  contrast_validation: true
  colorblind_safe: true
